name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (pylint + pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install pylint pyright numpy

      - name: pylint
        run: PYTHONPATH=stubs pylint flowslice_ai --fail-under=9.0

      - name: pyright
        run: PYTHONPATH=stubs pyright flowslice_ai

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy

      - name: pytest
        run: pytest tests/ -v