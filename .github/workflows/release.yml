name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  qa:
    name: QA (pylint + pyright + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install pylint pyright pytest numpy

      - name: pylint
        run: PYTHONPATH=stubs pylint flowslice_ai --fail-under=9.0

      - name: pyright
        run: PYTHONPATH=stubs pyright flowslice_ai

      - name: pytest
        run: pytest tests/ -v

  build-wheel:
    name: Сборка wheel
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Проверка версии из тега
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=$(python -c "from flowslice_ai.version import __version__; print(__version__)")
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$TAG" != "v$VERSION" ]]; then
            echo "::error::Тег $TAG не совпадает с версией пакета $VERSION (flowslice_ai/version.py)"
            exit 1
          fi
          echo "Версия пакета: $VERSION"

      - name: Сборка wheel
        run: python -m build --wheel

      - name: Проверка содержимого wheel
        run: |
          python - <<'EOF'
          import zipfile, glob
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          bad = [n for n in names if any(
              p in n for p in ("docs/", "example/", "assets/", "stubs/", "tests/", "flowslice_ai_plugin.py")
          )]
          if bad:
              raise SystemExit(f"В wheel попали лишние файлы: {bad}")
          print(f"OK: {whl}, файлов: {len(names)}")
          EOF

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 7

  create-release:
    name: Создание релиза
    needs: build-wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Загрузка артефакта
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: release-files/

      - name: Определение версии
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(python -c "from flowslice_ai.version import __version__; print(__version__)")
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Удаление существующего релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${{ steps.version.outputs.version }}" --yes --cleanup-tag 2>/dev/null || true

      - name: Создание релиза
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          body_path: RELEASE_NOTES.md
          tag_name: v${{ steps.version.outputs.version }}
          name: FlowSlice AI v${{ steps.version.outputs.version }}
          files: release-files/*