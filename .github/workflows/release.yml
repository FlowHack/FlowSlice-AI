name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  qa:
    name: QA (pylint + pyright + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install pylint pyright pytest numpy

      - name: pylint
        run: PYTHONPATH=stubs pylint flowslice_ai --fail-under=9.0

      - name: pyright
        run: PYTHONPATH=stubs pyright flowslice_ai

      - name: pytest
        run: pytest tests/ -v

      - name: Синтаксис JS
        run: node --check flowslice_ai/ui/app.js

      - name: JS-тесты чистых функций
        run: node tests/js/pure.test.js

  build-wheel:
    name: Сборка wheel
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Проверка версии из тега
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=$(python -c "from flowslice_ai.version import __version__; print(__version__)")
          if [[ "$TAG" == v* && "$TAG" != "v$VERSION" ]]; then
            echo "::error::Тег $TAG не совпадает с версией пакета $VERSION (flowslice_ai/version.py)"
            exit 1
          fi
          echo "Версия пакета: $VERSION"

      - name: Сборка wheel
        run: python -m build --wheel

      - name: Патч метаданных wheel
        run: python tools/patch_wheel.py dist/*.whl

      - name: Проверка содержимого wheel
        run: |
          python - <<'EOF'
          import glob
          import zipfile

          whl = glob.glob("dist/*.whl")[0]
          archive = zipfile.ZipFile(whl)
          names = archive.namelist()
          bad = [n for n in names if any(
              p in n for p in ("docs/", "example/", "assets/", "stubs/", "tests/", "flowslice_ai_plugin.py")
          )]
          if bad:
              raise SystemExit(f"В wheel попали лишние файлы: {bad}")

          metadata_name = next(n for n in names if n.endswith(".dist-info/METADATA"))
          metadata = archive.read(metadata_name).decode("utf-8")
          if "Name: FlowSlice AI" not in metadata:
              raise SystemExit("В METADATA нет человекочитаемого имени 'Name: FlowSlice AI'")
          if "Import-Name: flowslice_ai" not in metadata:
              raise SystemExit("В METADATA нет 'Import-Name: flowslice_ai'")

          from flowslice_ai.version import __version__ as version
          if f"Version: {version}" not in metadata:
              raise SystemExit(f"METADATA не содержит Version: {version}")

          required = [
              "flowslice_ai/__init__.py",
              "flowslice_ai/version.py",
              "flowslice_ai/paths.py",
              "flowslice_ai/plugin.py",
              "flowslice_ai/config.py",
              "flowslice_ai/constants.py",
              "flowslice_ai/errors.py",
              "flowslice_ai/i18n.py",
              "flowslice_ai/logging.py",
              "flowslice_ai/providers_data.py",
              "flowslice_ai/slicer_context.py",
              "flowslice_ai/assets.py",
              "flowslice_ai/orca_compat.py",
              "flowslice_ai/engine/__init__.py",
              "flowslice_ai/engine/api_client.py",
              "flowslice_ai/engine/commands.py",
              "flowslice_ai/engine/compaction.py",
              "flowslice_ai/engine/core.py",
              "flowslice_ai/engine/generation.py",
              "flowslice_ai/engine/handlers.py",
              "flowslice_ai/engine/net.py",
              "flowslice_ai/engine/providers.py",
              "flowslice_ai/engine/slicer_context.py",
              "flowslice_ai/sync/__init__.py",
              "flowslice_ai/sync/base.py",
              "flowslice_ai/sync/fetch.py",
              "flowslice_ai/sync/merge.py",
              "flowslice_ai/sync/sources.py",
              "flowslice_ai/ui/__init__.py",
              "flowslice_ai/ui/app.js",
              "flowslice_ai/ui/index.html",
              "flowslice_ai/ui/style.css",
          ]
          missing = [p for p in required if p not in names]
          if missing:
              raise SystemExit(f"В wheel отсутствуют обязательные файлы: {missing}")

          package_files = [n for n in names if n.startswith("flowslice_ai/") and n.endswith(".py")]
          print(f"OK: {whl}, файлов: {len(names)}, пакетных модулей: {len(package_files)}, версия {version}")
          EOF

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 7

  create-release:
    name: Создание релиза
    needs: build-wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Загрузка артефакта
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: release-files/

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Определение версии
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(python -c "from flowslice_ai.version import __version__; print(__version__)")
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Удаление существующего релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${{ steps.version.outputs.version }}" --yes --cleanup-tag 2>/dev/null || true

      - name: Создание релиза
        # gh release create: с GITHUB_TOKEN событие release: published НЕ порождает
        # новый workflow-run (ограничение GitHub), поэтому автопубликация в OrcaCloud
        # из publish-orcacloud.yml сработает только при наличии secrets.RELEASE_TOKEN
        # (PAT с правами repo). Без него релиз создаётся, а публикация выполняется
        # вручную: пересоздать релиз или workflow_dispatch в publish-orcacloud.yml.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if [[ -f RELEASE_NOTES.md ]]; then
            gh release create "$TAG" \
              --title "FlowSlice AI $TAG" \
              --notes-file RELEASE_NOTES.md \
              release-files/*
          else
            gh release create "$TAG" \
              --title "FlowSlice AI $TAG" \
              release-files/*
          fi