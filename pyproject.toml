[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# PEP 508 запрещает пробелы в имени проекта, поэтому в исходнике — валидный
# "FlowSlice-AI". Человекочитаемое имя "FlowSlice AI" проставляет в METADATA
# пост-сборочный скрипт tools/patch_wheel.py (Orca читает имя и автора оттуда).
name = "FlowSlice-AI"
description = "AI 3D-printing engineer inside OrcaSlicer: sees the model, presets and print history, and helps with mechanics, Klipper and fine-tuning materials (PETG, TPU and more)."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [{ name = "FlowHack" }]
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
# Numpy нужен только для глубокого анализа геометрии модели (режим deep).
# Плагин работает и без него: расширенные метрики просто не выгружаются.
deep = ["numpy>=1.24"]

[tool.setuptools.dynamic]
version = { attr = "flowslice_ai.version.__version__" }

# В wheel попадают ТОЛЬКО перечисленные пакеты: никаких docs/, example/,
# assets/, stubs/, tests/ и монолита flowslice_ai_plugin.py.
[tool.setuptools]
packages = ["flowslice_ai", "flowslice_ai.ui", "flowslice_ai.engine", "flowslice_ai.sync"]

[tool.setuptools.package-data]
"flowslice_ai.ui" = ["*.css", "*.html", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]