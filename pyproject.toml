[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# PEP 508 запрещает пробелы в имени проекта, поэтому в исходнике — валидный
# "FlowSlice-AI". Человекочитаемое имя "FlowSlice AI" проставляет в METADATA
# пост-сборочный скрипт tools/patch_wheel.py (Orca читает имя и автора оттуда).
name = "FlowSlice-AI"
description = "ИИ-инженер 3D-печати внутри OrcaSlicer: видит модель, пресеты и историю печати и помогает с механикой, Klipper и тонкой настройкой материалов (PETG, TPU и другие)."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [{ name = "FlowHack" }]
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
# Numpy нужен только для глубокого анализа геометрии модели (режим deep).
# Плагин работает и без него: расширенные метрики просто не выгружаются.
deep = ["numpy>=1.24"]

[tool.setuptools.dynamic]
version = { attr = "flowslice_ai.version.__version__" }

# В wheel попадают ТОЛЬКО перечисленные пакеты: никаких docs/, example/,
# assets/, stubs/, tests/ и монолита flowslice_ai_plugin.py.
[tool.setuptools]
packages = ["flowslice_ai", "flowslice_ai.ui", "flowslice_ai.engine"]

[tool.setuptools.package-data]
"flowslice_ai.ui" = ["*.css", "*.html", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]